<style>
:root{
    --primary-color:<?php echo $primary_color; ?>;
    --header-bg:<?php echo $header_bg; ?>;
    --nav-link-color:<?php echo $nav_link_col; ?>;
    --overlay-bg:#f8f8f8;
}

#site-header{
    position:relative;
    z-index:100;
    width:100%;
    background:var(--header-bg);
    border-bottom: 1px solid #eee;
}

.jb-header-inner{
    display:flex;
    align-items: flex-end; 
    justify-content: space-between;
    padding: 40px 20px 20px 20px; 
    max-width: 1200px;
    margin: 0 auto;
}

.site-branding img{
    max-height: 60px;
    width:auto;
    display:block;
}

.header-actions{
    display:flex;
    align-items:flex-end;
    gap: 20px; 
}

.jb-nav-desktop{
    display:none;
}

@media(min-width:1024px){
    .jb-nav-desktop{
        display:block;
    }

    .jb-nav-desktop ul{
        display:flex;
        align-items:flex-end;
        gap: 18px; 
        list-style:none;
        margin:0;
        padding:0;
    }

    .jb-nav-desktop ul li{
        position: relative;
    }

    /* Fixed syntax: semicolon moved to the end of the line */
    .jb-nav-desktop ul li a, 
    #site-header .jb-nav-desktop ul li a {
        text-decoration:none;
        text-transform:uppercase;
        font-size: 12px !important; 
        letter-spacing: 0.8px;
        font-weight: 400;
        color:var(--nav-link-color) !important;
        white-space:nowrap;
        transition: opacity 0.3s;
        display: block;
        padding: 0 0 2px 0;
    }
    
    .jb-nav-desktop ul li::before {
        content: "";
        position: absolute;
        top: -10px; 
        left: 0;
        width: 100%;
        height: 2px;
        background-color: #c4b2a3;
        transform: scaleX(0);
        transition: transform 0.3s ease;
        transform-origin: left;
    }

    .jb-nav-desktop ul li:hover::before {
        transform: scaleX(1);
    }
}

.lang-toggle{
    font-size: 10px !important;
    letter-spacing: 0.5px;
    text-transform:uppercase;
    cursor:pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 400;
    padding-bottom: 2px;
}

.mobile-toggle{
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:0;
    margin-left: 5px;
    padding-bottom: 4px;
}

.mobile-toggle span{
    height: 2px;
    background:#000;
    display:block;
}

.mobile-toggle span:nth-child(1){width:24px;}
.mobile-toggle span:nth-child(2){width:24px;}
.mobile-toggle span:nth-child(3){width:16px; align-self: flex-start;}

/* OVERLAY STYLES */
.nav-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:var(--overlay-bg);
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:0.4s ease-in-out;
    display:flex;
    flex-direction:column;
}

.nav-overlay.open{
    opacity:1;
    visibility:visible;
}

.overlay-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 30px 20px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
}

.close-button{
    background:none;
    border:none;
    font-size:40px;
    cursor:pointer;
}

.overlay-content{
    flex-grow:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay-content ul{
    list-style:none;
    padding:0;
    text-align:center;
}

.overlay-content ul li{
    margin:15px 0;
}

.overlay-content ul li a{
    text-decoration:none;
    text-transform:uppercase;
    color:#000;
    font-size:24px;
}

body.no-scroll{
    overflow:hidden;
}
</style>

<header id="site-header">
    <div class="jb-header-inner">

        <div class="site-branding">

    </div>

    <div id="nav-overlay" class="nav-overlay">

            <div class="site-branding">
                <?php if ( ! empty( $logo_url ) ) : ?>

            )); ?>
        </nav>
    </div>
</header>

<script>
function toggleMenu(){
    const overlay=document.getElementById('nav-overlay');
    const body=document.body;
    overlay.classList.toggle('open');
    body.classList.toggle('no-scroll');
}
</script>
